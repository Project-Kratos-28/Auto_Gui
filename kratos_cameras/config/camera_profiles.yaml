camera_stream_node:
  ros__parameters:
    stream.destination_host: 192.168.1.69

    profiles.normal.bitrate: 8000
    profiles.normal.width: 1280
    profiles.normal.height: 720
    profiles.normal.fps: 30
    profiles.normal.format: MJPG
    profiles.normal.encoder: h265 # Options: av1, h265

    profiles.zed.bitrate: 12000
    profiles.zed.width: 1920
    profiles.zed.height: 1080
    profiles.zed.fps: 30
    profiles.zed.format: NV12
    profiles.zed.encoder: av1  # Options: av1, h265

    profiles.gimbal.bitrate: 8000
    profiles.gimbal.width: 1920
    profiles.gimbal.height: 1080
    profiles.gimbal.fps: 60
    # OBSBOT Tiny 2 Lite (detected as gimbal): 1080p only as MJPG, and its MJPG needs the
    # software decoder (the hardware one stalls on its 4:2:2 frames)
    profiles.gimbal.format: MJPG
    profiles.gimbal.jpeg_decoder: sw  # Options: hw (default), sw
    profiles.gimbal.encoder: av1  # Options: av1, h265
